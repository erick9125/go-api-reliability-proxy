name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # -coverpkg spans every package, otherwise the integration tests in
      # tests/integration credit nothing to the packages they exercise and
      # internal/proxy reads as 0% despite being covered.
      - name: Test
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 20

      - name: Race detector
        run: go test -race ./...

      - name: Build
        run: go build -o reliability-proxy ./cmd/reliability-proxy

      - name: Docker build
        run: docker build -t reliability-proxy .

      # Catches a broken release config here instead of at tag time, when the
      # release is already half-published.
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
